name: Documentation Context
on:
  push:
    paths: ['docs/**', 'scripts/check_context.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'scripts/check_context.py', '.github/workflows/docs.yml']
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_context.py
      - run: pip install pytest
      - run: pytest -q tests/test_docs_baseline.py tests/integration/test_context_integrity.py
