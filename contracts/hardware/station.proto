syntax = "proto3";
package netcircuit.hardware.v1;

message Empty {}

message CapabilityRequest {
  string station_id = 1;
}

message BreadboardCapability {
  string id = 1;
  string model = 2;
}

message StationCapability {
  string station_id = 1;
  string mode = 2;
  bool available = 3;
  repeated BreadboardCapability breadboards = 4;
  string hardware_rpc_version = 5;
}

service StationService {
  rpc GetCapabilities(CapabilityRequest) returns (StationCapability);
}
